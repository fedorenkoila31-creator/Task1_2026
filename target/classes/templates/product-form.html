<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить товар</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { width: 400px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px;
                          box-sizing: border-box; border: 1px solid #ccc;
                          border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 20px;
                 background-color: #4CAF50; color: white; border: none;
                 border-radius: 4px; cursor: pointer; }
        .back { margin-top: 20px; display: inline-block; color: #4CAF50; }
    </style>
</head>
<body>
<h1>Добавить новый товар</h1>

<form th:action="@{/products/add}" th:object="${product}" method="post">
    <label for="name">Название:</label>
    <input type="text" id="name" th:field="*{name}" required/>

    <label for="price">Цена:</label>
    <input type="number" id="price" th:field="*{price}" step="0.01" required/>

    <label for="description">Описание:</label>
    <textarea id="description" th:field="*{description}" rows="4"></textarea>

    <button type="submit">Сохранить</button>
</form>

<a href="/products" class="back">← Вернуться к списку</a>
</body>
</html>
